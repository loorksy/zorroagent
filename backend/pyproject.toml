[project]
name = "zorro-backend"
version = "1.0.0"
description = "Zorro AI Trading Assistant — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "redis>=5.2.0",
  "arq>=0.26.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "cryptography>=44.0.0",
  "python-multipart>=0.0.18",
  "sse-starlette>=2.2.0",
  "pgvector>=0.3.6",
  "claude-agent-sdk>=0.1.0",
  "websockets>=14.0",
  "orjson>=3.10.0",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-httpx>=0.35.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
