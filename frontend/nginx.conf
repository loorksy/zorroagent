# In-container nginx: SPA + reverse proxy to the Zorro API (docker service name "api").
# Host nginx (sites-available/zorroagent.conf) is a separate layer in front of this.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location = /zorro.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="zorro.apk"';
        add_header X-Content-Type-Options nosniff;
        try_files /zorro.apk =404;
    }

    location = /download/zorro.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="zorro.apk"';
        add_header X-Content-Type-Options nosniff;
        try_files /zorro.apk =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
