# APK locations for the isolated zorroagent nginx site only.
# Included from sites-available/zorroagent.conf — do not add to other vhosts.

location = /zorro.apk {
    alias /opt/zorroagent/public/zorro.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="zorro.apk"';
    add_header X-Content-Type-Options nosniff;
}

location = /download/zorro.apk {
    alias /opt/zorroagent/public/zorro.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="zorro.apk"';
    add_header X-Content-Type-Options nosniff;
}
