# NEW nginx site for Zorro only.
# Install as /etc/nginx/sites-available/zorroagent.conf and symlink into sites-enabled.
# Do not merge this into other vhosts. Do not change other listen/root/proxy_pass lines.
#
# Public HTTP:  port 8088 (chosen because 80/443 were already in use by other sites)
# Optional name: zorro.lork.cloud / zorroagent.lork.cloud on port 80 (new server_name only)
# Upstream:      127.0.0.1:18088  (docker compose project "zorroagent", container zorroagent-web)

server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name zorro.lork.cloud zorroagent.lork.cloud;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
