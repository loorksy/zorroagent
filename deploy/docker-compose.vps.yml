# Isolated VPS stack. Always invoke with:
#   docker compose -p zorroagent --project-directory /opt/zorroagent \
#     -f /opt/zorroagent/deploy/docker-compose.vps.yml up -d
# Unique project/container/network names so this never attaches to other compose projects.
# Postgres and Redis are internal-only (no host ports).

name: zorroagent

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zorroagent-postgres
    environment:
      POSTGRES_USER: zorro
      POSTGRES_PASSWORD: ${ZORRO_DB_PASSWORD}
      POSTGRES_DB: zorro
    volumes:
      - zorroagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zorro"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - zorroagent

  redis:
    image: redis:7-alpine
    container_name: zorroagent-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - zorroagent_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - zorroagent

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zorroagent-api:local
    container_name: zorroagent-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://zorro:${ZORRO_DB_PASSWORD}@postgres:5432/zorro
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - zorroagent

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: zorroagent-api:local
    container_name: zorroagent-worker
    command: arq app.workers.main.WorkerSettings
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://zorro:${ZORRO_DB_PASSWORD}@postgres:5432/zorro
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - zorroagent

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: zorroagent-web:local
    container_name: zorroagent-web
    ports:
      # Localhost only. Host nginx (sites-available/zorroagent.conf) publishes 8088.
      - "127.0.0.1:18088:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - zorroagent

networks:
  zorroagent:
    name: zorroagent_net

volumes:
  zorroagent_pgdata:
    name: zorroagent_pgdata
  zorroagent_redis:
    name: zorroagent_redis
